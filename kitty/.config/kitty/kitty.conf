include ${HOME}/.cache/matugen/kitty.conf

allow_remote_control socket-only
listen_on unix:/tmp/kitty
shell_integration no-cursor

# kitty-scrollback.nvim Kitten alias
action_alias kitty_scrollback_nvim kitten '/home/coffee/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py'

# Browse scrollback buffer in nvim
map kitty_mod+h kitty_scrollback_nvim
# Browse output of the last shell command in nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
# Show clicked command output in nvim
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output


# Fonts
font_size 15.0

font_family      family="GohuFont uni14 Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto

# Text cursor customization
cursor_shape block
cursor_shape_unfocused hollow
cursor_beam_thickness 1.5
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshhold 2

# Scrollback
scrollbar never

# Mouse
mouse_hide_wait -1
url_style straight
show_hyperlink_targets always
paste_actions quote-urls-at-prompt,confirm,confirm-if-large
strip_trailing_spaces smart
