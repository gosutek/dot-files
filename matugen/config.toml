[config]
version_check = true

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland.lua'
output_path = '~/.cache/matugen/hyprland.lua'
post_hook = 'hyprctl reload'

[templates.kitty]
input_path = '~/.config/matugen/templates/colors-kitty.conf'
output_path = '~/.cache/matugen/colors-kitty.conf'
post_hook = "pkill -SIGUSR1 kitty"

[templates.fish]
input_path = "~/.config/matugen/templates/colors.fish"
output_path = "~/.cache/matugen/colors.fish"
post_hook = "fish ~/.cache/matugen/colors.fish"

[templates.starship]
input_path = "~/.config/matugen/templates/starship-colors.toml"
output_path = "~/.cache/matugen/starship-colors.toml"
